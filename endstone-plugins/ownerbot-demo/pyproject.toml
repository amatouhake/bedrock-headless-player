[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-ownerbot-demo"
version = "0.1.0"
description = "Video-demo chat controls for external OwnerBot players"
requires-python = ">=3.10"

[project.entry-points."endstone"]
ownerbot_demo = "endstone_ownerbot_demo.plugin:OwnerbotDemo"

[tool.setuptools.packages.find]
where = ["src"]
